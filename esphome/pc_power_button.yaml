# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

esphome:
  name: esp32-c3-supermini
  friendly_name: ESP32 C3 SuperMini

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret esp32_c3_supermini__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 13dB
  ap:
    ssid: ESP32 C3 SuperM Fallback Hotspot
    password: !secret esp32_c3_supermini__ap_password
captive_portal:

output:
  - platform: gpio
    pin: GPIO0
    id: momentary_button_output

  - platform: gpio
    pin:
      number: GPIO8
      inverted: true
    id: builtin_led_output

button:
  - platform: template
    name: "PC Power Button"
    on_press:
      - output.turn_on: momentary_button_output
      - output.turn_on: builtin_led_output
      - delay: 600ms
      - output.turn_off: momentary_button_output
      - output.turn_off: builtin_led_output

  - platform: template
    name: "PC Force Shutdown"
    on_press:
      - output.turn_on: momentary_button_output
      - output.turn_on: builtin_led_output
      - delay: 3s
      - output.turn_off: momentary_button_output
      - output.turn_off: builtin_led_output
